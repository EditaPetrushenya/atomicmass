<div class="card">
    <h1>
        ⚛️ Относительная атомная масса

    </div>

    <div class="panel" id="taskPanel">
        <div class="task-header">

            <div class="element-display" id="elementDisplay">H</div>
        </div>

        <div class="input-area">

            <span style="font-size:0.9rem; color: #3b6385;">(округлите до целых или десятых)</span>
        </div>

        <div class="action-group">
            <button class="btn btn-primary" id="checkBtn">✅ Проверить</button>
            <button class="btn btn-secondary" id="hintBtn">💡 Подсказка</button>
            <button class="btn btn-success" id="newTaskBtn" disabled>🎲 Новая задача</button>
        </div>

        <div class="feedback" id="feedbackArea">
            <span>👉 Введите ответ и нажмите «Проверить»</span>

        <div id="hintContainer" class="hint">Подсказка появится здесь</div>

    </div>
</div>

<!-- Модальное окно прогресса -->
<div class="modal" id="progressModal">

        <button class="close-modal" id="closeModalBtn">Закрыть</button>
    </div>
</div>

<!-- Модальное окно пароля -->

    </div>
</div>

        const answerInput = document.getElementById('answerInput');
        const feedbackEl = document.getElementById('feedbackArea');
        const hintContainer = document.getElementById('hintContainer');
        const taskTitle = document.getElementById('taskTitle');
        const taskCounterEl = document.getElementById('taskCounter');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const levelBtns = document.querySelectorAll('.level-btn');
        const levelBar = document.getElementById('levelBar');
        const elementDisplay = document.getElementById('elementDisplay');
        const checkBtn = document.getElementById('checkBtn');
        const hintBtn = document.getElementById('hintBtn');
        const newTaskBtn = document.getElementById('newTaskBtn');
        const progressText = document.getElementById('progressText');
        const progressDetailsList = document.getElementById('progressDetailsList');

        function saveProgress() {
            localStorage.setItem('chem_trainer_progress', JSON.stringify(progress));
        }

        // Случайный элемент
        function pickRandomElement() {
            const idx = Math.floor(Math.random() * ELEMENTS.length);
            return ELEMENTS[idx];
        }

        // Обновить задание для режима "По элементу"
        function refreshTableTask() {
            currentTargetElement = pickRandomElement();
            questionEl.innerHTML = `
                <div>Введите относительную атомную массу элемента</div>
                <div class="element-display" id="elementDisplay">${currentTargetElement.symbol}</div>
            `;
            answerInput.value = '';
            feedbackEl.innerHTML = '👉 Введите массу и нажмите «Проверить».';
            hintContainer.style.display = 'none';
            hintContainer.textContent = '';
            taskType = 'table';
            taskCounter++;
            taskCounterEl.textContent = `#${taskCounter}`;
            isAnswered = false;
            checkBtn.disabled = false;
            newTaskBtn.disabled = true; // Блокируем новую задачу до ответа
            updateProgressDisplay();
        }

        // ---- Генерация задачи для режима "Задачи" ----
        function generateTask() {
            const pool = TASKS[currentLevel] || TASKS.easy;
            const idx = Math.floor(Math.random() * pool.length);
            currentTaskIndex = idx;
            const task = pool[idx];
            currentAnswer = task.answer;
            return task.text;
        }

        // ---- Обновить интерфейс ----
        function refreshUI() {
            if (currentMode === 'table') {
                taskTitle.textContent = '📊 По элементу';
                levelBar.classList.remove('visible');
                refreshTableTask();
            } else {
                taskTitle.textContent = '🧩 Задачи';
                levelBar.classList.add('visible');
                const taskText = generateTask();
                questionEl.innerHTML = `<div style="font-size:1.3rem; font-weight:500;">${taskText}</div>`;
                answerInput.value = '';
                feedbackEl.innerHTML = '👉 Введите ответ и нажмите «Проверить»';
                hintContainer.style.display = 'none';
                hintContainer.textContent = '';
                taskType = 'task';
                taskCounter++;
                taskCounterEl.textContent = `#${taskCounter}`;
                isAnswered = false;
                checkBtn.disabled = false;
                newTaskBtn.disabled = true; // Блокируем новую задачу до ответа
                updateProgressDisplay();
            }
        }

        // ---- Проверка ----
        function checkAnswer() {
            if (isAnswered) {
                feedbackEl.innerHTML = '⏳ Ответ уже засчитан. Нажмите «Новая задача».';
                return;
            }

            const raw = answerInput.value.trim().replace(',', '.');
            if (raw === '') {
                feedbackEl.innerHTML = '⚠️ Введите число (например, 12 или 35.5)';
                return;
            }
            let userVal = parseFloat(raw);
            if (isNaN(userVal)) {
                feedbackEl.innerHTML = '❌ Некорректный ввод';
                return;
            }

            let correct = 0;
            let label = '';
            let modeKey = '';

            if (taskType === 'table') {
                if (!currentTargetElement) {
                    feedbackEl.innerHTML = '⚠️ Ошибка: элемент не выбран. Нажмите "Новая задача".';
                    return;
                }
                correct = currentTargetElement.mass;
                label = `для ${currentTargetElement.symbol}`;
                modeKey = 'table';
            } else {
                correct = currentAnswer;
                label = 'для задачи';
                modeKey = 'tasks';
            }

            const userRounded = Math.round(userVal * 10) / 10;
            const correctRounded = Math.round(correct * 10) / 10;
            const tolerance = 0.05;

            const isCorrect = Math.abs(userRounded - correctRounded) <= tolerance;

            // Запись прогресса
            progress[modeKey].total++;
            if (isCorrect) progress[modeKey].correct++;
            const taskDisplay = taskType === 'table' 
                ? `${currentTargetElement.symbol} → ?` 
                : (TASKS[currentLevel]?.[currentTaskIndex]?.text || 'задача');
            progress[modeKey].details.push({ task: taskDisplay, correct: isCorrect });
            saveProgress();

            if (isCorrect) {
                feedbackEl.innerHTML = `<span class="correct">✅ Верно!</span> Правильный ответ ${correctRounded.toFixed(1)} ${label}.`;
            } else {
                feedbackEl.innerHTML = `<span class="wrong">❌ Неверно.</span> Вы ввели ${userRounded.toFixed(1)}, правильный ответ ${correctRounded.toFixed(1)} ${label}.`;
            }

            isAnswered = true;
            checkBtn.disabled = true;
            newTaskBtn.disabled = false; // Разрешаем новое задание только после ответа
            updateProgressDisplay();
        }

        // ---- Подсказка ----
        function showHint() {
            let msg = '';
            if (taskType === 'table') {
                if (currentTargetElement) {
                    msg = `Подсказка: относительная атомная масса ${currentTargetElement.symbol} ≈ ${currentTargetElement.mass}. Округлите до целых или десятых.`;
                } else {
                    msg = 'Нажмите "Новая задача", чтобы получить элемент.';
                }
            } else {
                const pool = TASKS[currentLevel] || TASKS.easy;
                const task = pool[currentTaskIndex];
                if (task) {
                    msg = `Подсказка: используйте формулу Ar = m / (1.66·10⁻²⁷ кг) или отношение масс. Ответ округлите до целых/десятых.`;
                } else {
                    msg = 'Вспомните определение относительной атомной массы.';
                }
            }
            hintContainer.textContent = msg;
            hintContainer.style.display = 'block';
        }

        // ---- Прогресс ----
        function updateProgressDisplay() {
            const total = progress[currentMode].total;
            const correct = progress[currentMode].correct;
            progressText.textContent = `${correct} / ${total}`;
        }

        function showProgressDetails() {
            const modeName = currentMode === 'table' ? 'По элементу' : 'Задачи';
            const det = progress[currentMode].details;
            let html = `<strong>${modeName}</strong><br>`;
            if (det.length === 0) html += 'Нет выполненных заданий.';
            else {
                det.forEach((d, i) => {
                    const mark = d.correct ? '✅' : '❌';
                    html += `${i+1}. ${d.task} ${mark}<br>`;
                });
            }
            progressDetailsList.innerHTML = html;
            document.getElementById('progressModal').classList.add('active');
        }

        function resetProgress() {
            progress = {
                table: { total: 0, correct: 0, details: [] },
                tasks: { total: 0, correct: 0, details: [] }
            };
            localStorage.removeItem('chem_trainer_progress');
            localStorage.setItem('chem_trainer_reload_attempts', '0');
            if (reloadAttemptsText) reloadAttemptsText.textContent = '0';
            taskCounter = 0;
            updateProgressDisplay();
            feedbackEl.innerHTML = '🔄 Прогресс сброшен.';
            refreshUI();
        }

        // ---- Модалки и пароль ----
        let passwordAction = null;

        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('progressModal').classList.remove('active');
        });
        document.getElementById('closePasswordModalBtn').addEventListener('click', function() {
            document.getElementById('passwordModal').classList.remove('active');
        });

        document.getElementById('resetProgressBtn').addEventListener('click', function() {
            passwordAction = 'reset';
            document.getElementById('passwordModalTitle').textContent = '🔐 Введите пароль для сброса';
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').value = '';
        });

        document.getElementById('confirmPasswordBtn').addEventListener('click', function() {
            const pwd = document.getElementById('passwordInput').value.trim();
            if (pwd.toLowerCase() === 'dee') {
                document.getElementById('passwordModal').classList.remove('active');
                if (passwordAction === 'reset') {
                    resetProgress();
                }
            } else {
                alert('Неверный пароль!');
            }
        });

        // ---- Переключение режима ----
        function setMode(mode) {
            currentMode = mode;
            modeBtns.forEach(btn => {
                if (btn.dataset.mode === mode) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            refreshUI();
        }

        function setLevel(level) {
            currentLevel = level;
            levelBtns.forEach(btn => {
                if (btn.dataset.level === level) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (currentMode === 'tasks') refreshUI();
        }

        // ---- Обработчики ----
        checkBtn.addEventListener('click', checkAnswer);
        hintBtn.addEventListener('click', showHint);
        newTaskBtn.addEventListener('click', function() {
            if (!isAnswered) return;
            if (currentMode === 'table') {
                refreshTableTask();
            } else {
                refreshUI();
            }
        });
        document.getElementById('progressDetailsBtn').addEventListener('click', showProgressDetails);

        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const mode = this.dataset.mode;
                if (mode !== currentMode) setMode(mode);
            });
        });

        levelBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const level = this.dataset.level;
                if (level !== currentLevel) setLevel(level);
            });
        });

        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });

        // ---- Инициализация ----
        setMode('table');
        updateProgressDisplay();
    })();
</script>
</body>
</html>
